<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#768392"/>
      <stop offset="55%" stop-color="#919ead"/>
      <stop offset="100%" stop-color="#667280"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4ced8"/>
      <stop offset="100%" stop-color="#e4ebf2"/>
    </linearGradient>
    <linearGradient id="headband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="earcup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1376" height="500" fill="url(#bgWall)"/>
  <rect y="500" width="1376" height="268" fill="url(#deskTop)"/>
  <ellipse cx="688" cy="620" rx="250" ry="34" fill="url(#shadow)"/>

  <!-- Minimalist Charging Dock Base -->
  <path d="M548,595 L828,595 L848,622 L528,622 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="660" y="616" width="56" height="4" rx="2" fill="#38bdf8"/>

  <!-- Brushed Steel & Padded Headband Arch -->
  <path d="M492,390 C492,165 884,165 884,390" fill="none" stroke="url(#headband)" stroke-width="28" stroke-linecap="round"/>
  <path d="M548,255 C610,185 766,185 828,255" fill="none" stroke="#0f172a" stroke-width="34" stroke-linecap="round"/>

  <!-- Left Earcup & Memory Foam Cushion -->
  <g transform="rotate(-8 502 435)">
    <ellipse cx="520" cy="435" rx="44" ry="86" fill="#0f172a"/>
    <ellipse cx="494" cy="435" rx="52" ry="90" fill="url(#earcup)" stroke="#64748b" stroke-width="2"/>
    <circle cx="486" cy="435" r="24" fill="#111827" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.7"/>
  </g>

  <!-- Right Earcup & Memory Foam Cushion -->
  <g transform="rotate(8 874 435)">
    <ellipse cx="856" cy="435" rx="44" ry="86" fill="#0f172a"/>
    <ellipse cx="882" cy="435" rx="52" ry="90" fill="url(#earcup)" stroke="#64748b" stroke-width="2"/>
    <circle cx="890" cy="435" r="24" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Rotatable Noise-Cancelling Boom Microphone -->
  <path d="M484,462 C475,548 552,585 648,572" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M484,462 C475,548 552,585 648,572" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <rect x="636" y="558" width="46" height="24" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="670" cy="570" r="3.5" fill="#10b981"/>
</svg>
